# Parameters for multi-robot exploration coordinator.
#
# The legacy 2D auction is fully preserved when the feature switches below are
# disabled.  See docs/3d_mapping_plan.md for the TARE-inspired design.
multi_robot_coordinator:
  ros__parameters:
    use_sim_time: true

    # --- Legacy frontier / auction parameters ---
    # Frequency of the coordination cycle (Hz)
    rate_hz: 0.5
    # Minimum number of frontier cells to form a valid cluster
    min_frontier_size: 5
    # Utility weights: Utility = gain_scale * size - potential_scale * dist - orientation_scale * angle
    gain_scale: 1.0
    potential_scale: 2.0
    orientation_scale: 0.5
    # Minimum distance (meters) between two robots' targets to avoid conflict
    exclusion_radius: 1.5
    # Maximum time (seconds) allowed for a single navigation goal before cancelling
    goal_timeout: 90.0
    # Number of failures before an unreachable frontier is permanently blacklisted
    blacklist_retry_limit: 2
    # Radius around a blacklisted point to ignore (meters)
    blacklist_radius: 0.9
    # Minimum clearance from known obstacles for frontier safe goal retraction (meters)
    min_clearance: 0.35

    # --- No-progress livelock breaker ---
    # A goal that succeeds almost instantly without the robot having moved
    # means it was already standing at the viewpoint; the frontier pocket
    # may never clear (stale merged map / cells a 2D lidar cannot see).
    # After this many consecutive repeats the spot is blacklisted so the
    # residual stage and convergence are not blocked forever.
    no_progress_time: 2.0
    no_progress_distance: 0.3
    no_progress_limit: 2

    # --- 3D information gain ---
    use_3d_gain: true
    octomap_cloud_topic: "/octomap_point_cloud_centers"
    voxel_index_resolution: 0.10
    voxel_min_z: 0.08
    voxel_max_z: 2.0
    voxel_min_points_per_column: 3
    voxel_max_points: 400000
    voxel_update_period: 1.0
    gain_3d_window_radius: 1.5
    gain_3d_scale: 40.0
    gain_3d_density_weight: 0.30
    gain_3d_unknown_weight: 0.35
    gain_3d_floating_weight: 0.15
    gain_3d_height_weight: 0.10
    gain_3d_occupancy_weight: 0.10
    gain_3d_density_ref: 0.18
    gain_3d_occupancy_ref: 8.0
    gain_3d_height_ref: 0.80
    gain_3d_wall_zmin: 0.25
    gain_3d_wall_zmax: 1.30
    voxel_cloud_warn_timeout: 15.0
    cycle_time_budget_ms: 150.0

    # --- Local / Global hierarchical scheduling ---
    local_scheduling_enable: true
    local_radius: 6.0
    local_max_waypoints: 6
    local_min_spacing: 1.2
    local_max_tour_length: 10.0
    local_tour_score_dist_weight: 1.0
    local_release_unselected: false
    local_release_cooldown: 5.0
    local_release_score_penalty: 0.7
    tsp_2opt_passes: 2
    global_roi_enable: true
    global_roi_distance_offset: 1.0
    global_roi_min: 0.05
    global_roi_scale: 5.0
    global_max_distance: 0.0
    global_max_candidates: 8

    # --- Tour dispatch / supervision ---
    use_through_poses: true
    through_poses_fail_limit: 2
    action_wait_sec: 2.0
    tf_wait_sec: 0.1
    tour_timeout_per_waypoint: 25.0
    tour_stall_window: 20.0
    tour_stall_min_translation: 0.10
    tour_stall_min_progress: 0.20
    tour_rewrite_on_invalidation: true
    tour_max_rewrites: 2

    # --- Out-of-bounds self recovery ---
    # The global costmap is exactly as large as a robot's SLAM map, so a robot
    # that stops a few centimetres past the mapped area sits outside its own
    # costmap: NavfnPlanner rejects the start pose and every goal aborts with
    # error 203 before any BT recovery can run.  On that failure the
    # coordinator drives the robot backwards with nav2_behaviors/backup (which
    # uses the rolling local costmap) so it can plan again.
    backup_recovery_enable: true
    backup_distance: 0.40
    backup_speed: 0.06
    backup_cooldown: 20.0

    # --- Residual blind-spot cleanup ---
    residual_enable: true
    residual_activation_cycles: 3
    residual_min_cluster_cells: 25
    residual_min_density: 0.08
    residual_min_unknown_frac: 0.20
    residual_structure_radius: 2.5
    residual_min_structure_columns: 3
    residual_ring_radius: 1.0
    residual_ring_min_empty_sectors: 3
    residual_viewpoint_search_radius: 2.5
    residual_max_candidates: 4
    residual_dedupe_radius: 1.5
    residual_score_scale: 10.0
    residual_blacklist_radius: 1.0
    residual_max_attempts: 2
    residual_coverage_hole_enable: false

    # --- Convergence ---
    convergence_enable: true
    convergence_cycles_required: 6
    convergence_residual_gain_threshold: 0.50
    convergence_voxel_growth_epsilon: 25
    convergence_voxel_growth_rate: 0.005
    convergence_require_3d: true
    fallback_convergence_timeout: 120.0
    convergence_stop_dispatch: true

    # Map freshness used by convergence and stale-map handling.
    map_loss_timeout: 5.0

    # --- Nav2 health watchdog ---
    # When a robot's Nav2 action servers vanish (lifecycle bond timeout or a
    # failed re-bringup) report it once and then remind at this period, instead
    # of re-auctioning the same frontier and logging "Action server not ready!"
    # at the coordination rate.
    nav_outage_warn_period: 15.0
