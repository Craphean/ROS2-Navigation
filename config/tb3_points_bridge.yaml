# Bridge for the 3D LiDAR point cloud.
# GZ publishes the point cloud on <lidar3d topic>/points.
# With expand_gz_topic_names: true and __ns:=/robot1, this becomes
#   /robot1/lidar3d/points -> /robot1/points
- ros_topic_name: "points"
  gz_topic_name: "lidar3d/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Forward camera.  gz-sim publishes the colour image on <topic> itself and
# the calibration on <topic>_info, i.e. /robot1/camera and /robot1/camera_info.
- ros_topic_name: "camera/image"
  gz_topic_name: "camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "camera/camera_info"
  gz_topic_name: "camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
